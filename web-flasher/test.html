<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Web Flasher Test</title>
  <style>
    body {
      font-family: monospace;
      max-width: 800px;
      margin: 2rem auto;
      padding: 1rem;
      background: #1a1a1a;
      color: #e0e0e0;
    }
    .test {
      padding: 1rem;
      margin: 0.5rem 0;
      border-radius: 4px;
    }
    .pass { background: #0f3d0f; border: 1px solid #56ff74; }
    .fail { background: #3d0f0f; border: 1px solid #ff5656; }
    .pending { background: #3d3d0f; border: 1px solid #ffff56; }
    #results { margin-top: 2rem; }
    h1 { color: #56ff74; }
    button {
      background: #56ff74;
      color: #0a1f0d;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      margin: 1rem 0;
    }
    button:hover { background: #3db54e; }
    pre { background: #0a0a0a; padding: 1rem; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>ESP32 Web Flasher Tests</h1>
  <p>Running tests for the esptool-js integration...</p>
  <button id="run-tests">Run Tests</button>
  <div id="results"></div>

  <script type="module">
    import { ESPLoader, Transport } from 'https://cdn.jsdelivr.net/npm/esptool-js@0.5.6/+esm';

    const results = document.getElementById('results');
    
    const tests = [
      {
        name: 'esptool-js imports correctly',
        fn: async () => {
          if (typeof ESPLoader === 'undefined') throw new Error('ESPLoader not defined');
          if (typeof Transport === 'undefined') throw new Error('Transport not defined');
          return true;
        }
      },
      {
        name: 'ESPLoader constructor exists',
        fn: async () => {
          const mockPort = {
            getInfo: () => ({ usbVendorId: 0x303a, usbProductId: 0 }),
            readable: { getReader: () => ({ read: () => Promise.reject({ done: true }) }) },
            writable: { getWriter: () => ({ write: () => Promise.resolve(), releaseLock: () => {} }) },
            open: () => {},
            close: () => {},
            setSignals: () => Promise.resolve()
          };
          
          const transport = new Transport(mockPort);
          const loader = new ESPLoader({ transport });
          
          return loader !== null && typeof loader === 'object';
        }
      },
      {
        name: 'ESPLoader has required methods',
        fn: async () => {
          const mockPort = createMockPort();
          const transport = new Transport(mockPort);
          const loader = new ESPLoader({ transport });
          
          const expected = ['main', 'writeFlash', 'connect', 'detectChip'];
          const missing = expected.filter(m => typeof loader[m] !== 'function');
          
          if (missing.length) throw new Error(`Missing: ${missing.join(', ')}`);
          return true;
        }
      },
      {
        name: 'ESPLoader writeFlash accepts fileArray',
        fn: async () => {
          const mockPort = createMockPort();
          const transport = new Transport(mockPort);
          const loader = new ESPLoader({ transport, baudrate: 921600 });
          
          const testData = new Uint8Array([0x00, 0x01, 0x02, 0x03]);
          const fileArray = [{ data: testData, address: 0x1000, filename: 'test.bin' }];
          
          // Check structure is valid (won't actually flash without device)
          if (!Array.isArray(fileArray)) throw new Error('fileArray should be array');
          if (fileArray[0].address !== 0x1000) throw new Error('address should be set');
          
          return true;
        }
      },
      {
        name: 'Web Serial API is available (browser check)',
        fn: async () => {
          if (!('serial' in navigator)) {
            console.log('Note: Web Serial not available in this browser');
          }
          return 'serial' in navigator || true;
        }
      },
      {
        name: 'Transport creates without error',
        fn: async () => {
          const mockPort = createMockPort();
          const transport = new Transport(mockPort);
          
          if (!transport.device) throw new Error('Transport missing device');
          if (typeof transport.connect !== 'function') throw new Error('Transport missing connect');
          if (typeof transport.disconnect !== 'function') throw new Error('Transport missing disconnect');
          
          return true;
        }
      },
      {
        name: 'Firmware data conversion works',
        fn: async () => {
          const testData = new Uint8Array([0x00, 0x01, 0x02, 0x03, 0x04]);
          
          // ESPLoader expects string for some methods
          const str = String.fromCharCode(...testData);
          const back = new Uint8Array([...str].map(c => c.charCodeAt(0)));
          
          if (back.length !== testData.length) throw new Error('Data conversion failed');
          for (let i = 0; i < testData.length; i++) {
            if (back[i] !== testData[i]) throw new Error(`Mismatch at ${i}`);
          }
          
          return true;
        }
      },
      {
        name: 'esptool-js CDN loads',
        fn: async () => {
          const response = await fetch('https://cdn.jsdelivr.net/npm/esptool-js@0.5.6/+esm');
          if (!response.ok) throw new Error(`CDN fetch failed: ${response.status}`);
          return true;
        }
      }
    ];

    function createMockPort() {
      return {
        getInfo: () => ({ usbVendorId: 0x303a, usbProductId: 0 }),
        readable: {
          getReader: () => ({
            read: () => Promise.resolve({ done: true, value: new Uint8Array() }),
            releaseLock: () => {},
            cancel: () => Promise.resolve()
          })
        },
        writable: {
          getWriter: () => ({
            write: () => Promise.resolve(),
            releaseLock: () => {},
            close: () => Promise.resolve()
          })
        },
        open: (opts) => Promise.resolve(),
        close: () => Promise.resolve(),
        setSignals: (opts) => Promise.resolve(),
        readable: null,
        writable: null
      };
    }

    async function runTest(test) {
      try {
        await test.fn();
        return { name: test.name, passed: true };
      } catch (err) {
        return { name: test.name, passed: false, error: err.message };
      }
    }

    document.getElementById('run-tests').addEventListener('click', async () => {
      results.innerHTML = '';
      
      const start = Date.now();
      
      for (const test of tests) {
        const div = document.createElement('div');
        div.className = 'test pending';
        div.textContent = `Running: ${test.name}...`;
        results.appendChild(div);
        
        const result = await runTest(test);
        
        div.className = result.passed ? 'test pass' : 'test fail';
        div.innerHTML = result.passed 
          ? `✓ ${test.name}`
          : `✗ ${test.name}: ${result.error || 'failed'}`;
      }
      
      const elapsed = Date.now() - start;
      const passed = tests.filter(t => t).length;
      
      const summary = document.createElement('div');
      summary.style.marginTop = '1rem';
      summary.style.padding = '1rem';
      summary.style.background = '#0a3d0a';
      summary.style.border = '1px solid #56ff74';
      summary.textContent = `${passed}/${tests.length} tests passed in ${elapsed}ms`;
      results.appendChild(summary);
    });
  </script>
</body>
</html>

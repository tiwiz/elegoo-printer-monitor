<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Printer Monitor - Firmware Flash</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #0a1f0d;
      --bg-card: #122917;
      --bg-input: #1a351f;
      --primary: #56ff74;
      --primary-dim: #3db54e;
      --primary-glow: rgba(86, 255, 116, 0.3);
      --text: #e8ffe4;
      --text-dim: #7cb77c;
      --error: #ff5656;
      --border: #2a4d2a;
    }

    body {
      font-family: 'IBM Plex Mono', 'Fira Code', monospace;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(ellipse at 50% 0%, rgba(86, 255, 116, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(86, 255, 116, 0.05) 0%, transparent 40%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 1rem;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px var(--primary-glow), inset 0 0 20px rgba(0,0,0,0.2);
    }

    .logo svg {
      width: 36px;
      height: 36px;
      fill: var(--bg-dark);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--primary);
    }

    .subtitle {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 0.5rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .card-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      margin-bottom: 1rem;
    }

    .btn {
      width: 100%;
      padding: 1rem;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--bg-dark);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dim);
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
    }

    input[type="file"] {
      display: none;
    }

    .file-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      border: 2px dashed var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .file-label:hover {
      border-color: var(--primary);
      background: rgba(86, 255, 116, 0.05);
    }

    .file-label svg {
      width: 32px;
      height: 32px;
      fill: var(--text-dim);
      margin-bottom: 0.75rem;
    }

    .file-label span {
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem;
      background: var(--bg-input);
      border-radius: 6px;
      margin-top: 0.75rem;
    }

    .file-info svg {
      width: 20px;
      height: 20px;
      fill: var(--primary);
      flex-shrink: 0;
    }

    .file-info .details {
      flex: 1;
      min-width: 0;
    }

    .file-info .name {
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-info .size {
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
    }

    .status-row:last-child {
      border-bottom: none;
    }

    .status-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .status-icon.pending {
      background: var(--bg-input);
      border: 2px solid var(--border);
    }

    .status-icon.connecting {
      background: var(--bg-input);
      border: 2px solid var(--text-dim);
      animation: pulse 1s ease infinite;
    }

    .status-icon.ready {
      background: var(--primary);
      border: 2px solid var(--primary);
    }

    .status-icon.error {
      background: var(--error);
      border: 2px solid var(--error);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-icon svg {
      width: 14px;
      height: 14px;
      fill: var(--bg-dark);
    }

    .status-icon.error svg {
      fill: white;
    }

    .status-text {
      flex: 1;
    }

    .status-text .label {
      font-size: 0.85rem;
    }

    .status-text .detail {
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    .progress-bar {
      height: 8px;
      background: var(--bg-input);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 4px;
      width: 0%;
      transition: width 0.3s ease;
      box-shadow: 0 0 10px var(--primary-glow);
    }

    .message {
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-top: 1rem;
      display: none;
    }

    .message.error {
      background: rgba(255, 86, 86, 0.1);
      border: 1px solid var(--error);
      color: var(--error);
      display: block;
    }

    .message.success {
      background: rgba(86, 255, 116, 0.1);
      border: 1px solid var(--primary);
      color: var(--primary);
      display: block;
    }

    .message.info {
      background: rgba(86, 255, 116, 0.05);
      border: 1px solid var(--border);
      color: var(--text-dim);
      display: block;
    }

    .hidden {
      display: none !important;
    }

    .hint {
      font-size: 0.7rem;
      color: var(--text-dim);
      text-align: center;
      margin-top: 1rem;
    }

    .console-log {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 0.7rem;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--text-dim);
      max-height: 120px;
      overflow-y: auto;
      margin-top: 0.75rem;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .console-log .log-line {
      margin: 0;
    }

    .console-log .log-error {
      color: var(--error);
    }

    .console-log .log-success {
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      </div>
      <h1>ESP32 Printer Monitor</h1>
      <p class="subtitle">Firmware Flash Tool</p>
    </header>

    <div class="card" id="step-file">
      <div class="card-title">1. Select Firmware</div>
      <label class="file-label" id="file-drop">
        <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
        <span id="file-text">Drop .bin file here or click to browse</span>
      </label>
      <input type="file" id="firmware-input" accept=".bin">
      <div class="file-info hidden" id="file-info">
        <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg>
        <div class="details">
          <div class="name" id="file-name">firmware.bin</div>
          <div class="size" id="file-size">0 KB</div>
        </div>
      </div>
    </div>

    <div class="card" id="step-connect">
      <div class="card-title">2. Connect Device</div>
      <button class="btn btn-primary" id="btn-connect">Connect ESP32 over USB</button>
      <div class="hint">Plug in your ESP32 CYD via USB-C. Use Chrome or Edge.</div>
    </div>

    <div class="card hidden" id="step-flash">
      <div class="card-title">3. Flash Firmware</div>
      <div class="status-row">
        <div class="status-icon pending" id="icon-device">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
        </div>
        <div class="status-text">
          <div class="label">Device</div>
          <div class="detail" id="device-info">Not connected</div>
        </div>
      </div>
      <div class="status-row">
        <div class="status-icon pending" id="icon-flash">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
        </div>
        <div class="status-text">
          <div class="label">Flash</div>
          <div class="detail" id="flash-info">Ready</div>
        </div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <button class="btn btn-primary" id="btn-flash" style="margin-top: 1rem;">Flash Firmware</button>
      <div class="console-log" id="console-log"></div>
      <div class="message hidden" id="message"></div>
    </div>

    <div class="card hidden" id="step-done">
      <div class="card-title">Complete</div>
      <div class="message success" id="success-msg">
        Firmware flashed successfully! The device will restart.
      </div>
      <button class="btn btn-secondary" id="btn-another" style="margin-top: 1rem;">Flash Another Device</button>
    </div>
  </div>

  <script type="module">
    import { ESPLoader, Transport } from 'https://cdn.jsdelivr.net/npm/esptool-js@0.5.6/+esm';

    const ESP_ROM_BAUD = 115200;
    const FLASH_BAUD = 921600;
    const USB_VENDORS = [
      { usbVendorId: 0x303a },   // Espressif
      { usbVendorId: 0x1a86 },   // CH340
      { usbVendorId: 0x10c4 }    // CP2102
    ];

    const STATE = {
      IDLE: 'idle',
      CONNECTING: 'connecting',
      READY: 'ready',
      FLASHING: 'flashing',
      DONE: 'done',
      ERROR: 'error'
    };

    let state = STATE.IDLE;
    let port = null;
    let transport = null;
    let esploader = null;
    let firmwareData = null;
    let chipInfo = null;

    const elements = {
      fileDrop: document.getElementById('file-drop'),
      fileText: document.getElementById('file-text'),
      firmwareInput: document.getElementById('firmware-input'),
      fileInfo: document.getElementById('file-info'),
      fileName: document.getElementById('file-name'),
      fileSize: document.getElementById('file-size'),
      btnConnect: document.getElementById('btn-connect'),
      stepFile: document.getElementById('step-file'),
      stepConnect: document.getElementById('step-connect'),
      stepFlash: document.getElementById('step-flash'),
      stepDone: document.getElementById('step-done'),
      btnFlash: document.getElementById('btn-flash'),
      iconDevice: document.getElementById('icon-device'),
      deviceInfo: document.getElementById('device-info'),
      iconFlash: document.getElementById('icon-flash'),
      flashInfo: document.getElementById('flash-info'),
      progressFill: document.getElementById('progress-fill'),
      consoleLog: document.getElementById('console-log'),
      message: document.getElementById('message'),
      successMsg: document.getElementById('success-msg'),
      btnAnother: document.getElementById('btn-another')
    };

    const logElement = {
      write: (text, isError = false, isSuccess = false) => {
        const p = document.createElement('p');
        p.className = 'log-line' + (isError ? ' log-error' : '') + (isSuccess ? ' log-success' : '');
        p.textContent = text;
        elements.consoleLog.appendChild(p);
        elements.consoleLog.scrollTop = elements.consoleLog.scrollHeight;
      }
    };

    if (!('serial' in navigator)) {
      elements.btnConnect.disabled = true;
      elements.btnConnect.textContent = 'Web Serial not supported';
      logElement.write('Error: Web Serial API not supported. Use Chrome or Edge.', true);
    }

    elements.firmwareInput.addEventListener('change', handleFileSelect);
    elements.fileDrop.addEventListener('click', () => elements.firmwareInput.click());

    elements.fileDrop.addEventListener('dragover', (e) => {
      e.preventDefault();
      elements.fileDrop.style.borderColor = 'var(--primary)';
    });

    elements.fileDrop.addEventListener('dragleave', () => {
      elements.fileDrop.style.borderColor = '';
    });

    elements.fileDrop.addEventListener('drop', (e) => {
      e.preventDefault();
      elements.fileDrop.style.borderColor = '';
      const file = e.dataTransfer.files[0];
      if (file && file.name.endsWith('.bin')) {
        loadFirmwareFile(file);
      } else {
        logElement.write('Error: Please drop a .bin file', true);
      }
    });

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file) loadFirmwareFile(file);
    }

    async function loadFirmwareFile(file) {
      const data = await file.arrayBuffer();
      firmwareData = new Uint8Array(data);
      elements.fileName.textContent = file.name;
      elements.fileSize.textContent = formatSize(firmwareData.length);
      elements.fileText.textContent = file.name;
      elements.fileInfo.classList.remove('hidden');
      logElement.write(`Loaded firmware: ${file.name} (${formatSize(firmwareData.length)})`, false, true);
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    elements.btnConnect.addEventListener('click', connectDevice);

    async function connectDevice() {
      try {
        logElement.write('Requesting serial port...');
        
        port = await navigator.serial.requestPort({
          filters: USB_VENDORS
        });

        setState(STATE.CONNECTING);
        updateDeviceStatus('Connecting...', 'connecting');

        transport = new Transport(port);

        esploader = new ESPLoader({
          transport: transport,
          baudrate: FLASH_BAUD,
          romBaudrate: ESP_ROM_BAUD,
          terminal: logElement
        });

        chipInfo = await esploader.main();
        
        updateDeviceStatus(chipInfo, 'ready');
        logElement.write(`Connected to ${chipInfo}`, false, true);
        
        setState(STATE.READY);
        elements.stepConnect.classList.add('hidden');
        elements.stepFlash.classList.remove('hidden');

      } catch (err) {
        logElement.write(`Connection failed: ${err.message}`, true);
        updateDeviceStatus(err.message, 'error');
        setState(STATE.ERROR);
      }
    }

    function updateDeviceStatus(text, iconState) {
      elements.deviceInfo.textContent = text;
      elements.iconDevice.className = 'status-icon ' + iconState;
    }

    elements.btnFlash.addEventListener('click', flashFirmware);

    async function flashFirmware() {
      if (!firmwareData || !esploader) {
        logElement.write('Error: No firmware loaded or device not connected', true);
        return;
      }

      setState(STATE.FLASHING);
      elements.btnFlash.disabled = true;
      elements.flashInfo.textContent = 'Flashing...';
      elements.iconFlash.className = 'status-icon connecting';
      elements.progressFill.style.width = '0%';
      elements.message.className = 'message hidden';

      try {
        const fileArray = [{
          data: firmwareData,
          address: 0x1000,
          filename: 'firmware.bin'
        }];

        logElement.write('Erasing flash...');
        
        await esploader.writeFlash({
          fileArray: fileArray,
          flashSize: 'keep',
          flashMode: 'keep',
          flashFreq: 'keep',
          eraseAll: true,
          compress: true,
          reportProgress: (chunk, written, total) => {
            const percent = Math.floor((written / total) * 100);
            elements.progressFill.style.width = percent + '%';
            elements.flashInfo.textContent = `${percent}%`;
            logElement.write(`Writing: ${percent}%`);
          }
        });

        elements.iconFlash.className = 'status-icon ready';
        elements.flashInfo.textContent = 'Complete';
        elements.progressFill.style.width = '100%';
        
        logElement.write('Flashing complete!', false, true);
        
        setState(STATE.DONE);
        elements.stepFlash.classList.add('hidden');
        elements.stepDone.classList.remove('hidden');

      } catch (err) {
        logElement.write(`Flash failed: ${err.message}`, true);
        elements.iconFlash.className = 'status-icon error';
        elements.flashInfo.textContent = 'Failed';
        elements.message.textContent = err.message;
        elements.message.className = 'message error';
        setState(STATE.ERROR);
        elements.btnFlash.disabled = false;
      }
    }

    function setState(s) {
      state = s;
    }

    elements.btnAnother.addEventListener('click', () => location.reload());
  </script>
</body>
</html>

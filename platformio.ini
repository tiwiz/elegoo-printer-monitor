; PlatformIO Project Configuration File
;
; Build types:
;   pio run           - Debug build
;   pio run -e release - Release build (optimized)
;
; Release output: .pio/build/esp32dev/firmware.bin

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
extends = common_build
lib_deps = 
	bodmer/TFT_eSPI@^2.5.43
	bodmer/TFT_eWidget@^0.0.6
	bblanchon/ArduinoJson@^7.2.2
	links2004/WebSockets@^2.4.1
	robtillaart/UUID@^0.2.1
build_flags = 
	${common_build.build_flags}
	-DCORE_DEBUG_LEVEL=4

[common_build]
build_flags = 
	-DUSER_SETUP_LOADED=1
	-DILI9341_2_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DTOUCH_CS=32
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	-DTFT_RGB_ORDER=TFT_BGR



[env:release]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps = 
	${env:esp32dev.lib_deps}
build_flags = 
	${common_build.build_flags}
	-DCORE_DEBUG_LEVEL=0
	-DDEBUG_MODE=0
	-Os
	-ffunction-sections
	-fdata-sections